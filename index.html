<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <title>Stepper Melody Lab</title>
    <meta property="og:title" content="Stepper Melody Lab" />
    <meta property="og:description" content="Turn any MIDI file into music played by stepper motors." />
    <meta property="og:image" content="https://raw.githubusercontent.com/robert-brunner/StepperMelodyLab/main/Screenshots/Landing.png" />
    <meta property="og:image" content="https://raw.githubusercontent.com/robert-brunner/StepperMelodyLab/main/Screenshots/Pinout.png" />
    <meta property="og:url" content="https://midi-motor-music-box.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <style>
      html, body { margin: 0; padding: 0; }
      body { background: #0d0221; min-height: 100vh; }

      /* ── Scenery. ONE dial: #scene opacity (1 = full poster, lower = subtler) ── */
      #scene { position: fixed; inset: 0; z-index: -1; pointer-events: none; opacity: 0.75; overflow: hidden; }
      #scene > * { position: absolute; }

      .sky {
        inset: 0;
        background:
          radial-gradient(1.5px 1.5px at 12% 10%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 27% 6%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 63% 5%, #fff 50%, transparent 51%),
          radial-gradient(1.5px 1.5px at 84% 12%, #fff 50%, transparent 51%),
          radial-gradient(1px 1px at 93% 4%, #fff 50%, transparent 51%),
          linear-gradient(180deg, #0d0221 0%, #1a0a4a 16%, #3a0f6e 28%, #9b1a8e 37%, #ff2975 43%, #2a0848 45%, #0a0620 45.2%, #0a0620 100%);
      }
      /* faint horizontal haze streaks in the pink band, like the reference */
      .haze {
        left: 0; right: 0; top: 30vh; height: 15vh;
        background: repeating-linear-gradient(0deg, rgba(255,255,255,0.05) 0 2px, transparent 2px 7px);
      }

      .sunwrap { left: 0; right: 0; top: 0; height: 45vh; overflow: hidden; }
      .glow {
        position: absolute; left: 50%; bottom: -8vmin; transform: translateX(-50%);
        filter: drop-shadow(0 0 40px rgba(255,41,117,0.9)) drop-shadow(0 0 90px rgba(242,34,255,0.6));
      }
      .sun {
        width: 52vmin; height: 52vmin; border-radius: 50%;
        background: linear-gradient(180deg, #fff27a 0%, #ffd319 30%, #ff901f 60%, #ff2975 100%);
        -webkit-mask-image: linear-gradient(#000 0 58%, transparent 0), repeating-linear-gradient(#000 0 10px, transparent 10px 14px);
                mask-image: linear-gradient(#000 0 58%, transparent 0), repeating-linear-gradient(#000 0 10px, transparent 10px 14px);
      }

      .skyline { left: 0; width: 100%; top: calc(45vh - 16vh); height: 16vh; }
      .skyline .mtn  { fill: #3b1a78; }
      .skyline .bld  { fill: #1a0a3e; }
      .skyline .win  { fill: #ffd319; opacity: 0.55; }

      .horizon {
        left: 0; right: 0; top: calc(45vh - 1px); height: 2px;
        background: linear-gradient(90deg, transparent, #ff2975 15%, #f222ff 50%, #ff2975 85%, transparent);
        box-shadow: 0 0 12px #ff2975, 0 0 26px #f222ff;
      }

      /* Cyan perspective grid (SVG, true vanishing point, lines roll toward viewer) */
      .grid {
        left: 0; top: 45vh; width: 100%; height: 55vh;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0%, #000 30%);
                mask-image: linear-gradient(to bottom, transparent 0%, #000 30%);
        filter: drop-shadow(0 0 3px rgba(45,226,230,0.9));
      }
      .grid line { stroke: #2de2e6; stroke-width: 1.6; vector-effect: non-scaling-stroke; stroke-opacity: 0.75; }

      .palm { bottom: 0; height: 82vh; overflow: visible; transform: translateY(calc(var(--sy, 0) * -0.35px)); will-change: transform; }
      .palm.left  { left: -2vw; }
      .palm.right { right: -2vw; }
      .palm rect { fill: #05010c; }
      .palm path, .palm circle { fill: #05010c; stroke: #f222ff; stroke-width: 1; stroke-opacity: 0.35; }

      /* CRT scanlines */
      html::after {
        content: ""; position: fixed; inset: 0; z-index: 9998; pointer-events: none;
        background: repeating-linear-gradient(0deg, rgba(0,0,0,0.12) 0 1px, transparent 1px 3px);
      }

      ::selection { background: #f222ff; color: #0d0221; }
      button:hover { filter: brightness(1.15); }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      input[type=range] { accent-color: #ffd319; }

      /* 8-bit press: button drops into its shadow and inverts */
      button, a[href*="github.com"] { transition: transform 60ms steps(2), box-shadow 60ms steps(2); }
      button[style*="linear-gradient"]:active:not(:disabled) {
        background: #1a0833 !important;
        color: #ff2975 !important;
        box-shadow: inset 0 0 0 2px #f222ff, 0 0 18px rgba(242,34,255,0.8) !important;
        transform: translate(4px, 4px);
      }
      button[style*="transparent"]:active:not(:disabled),
      a[href*="github.com"]:active {
        background: #ffd319 !important;
        color: #1a0833 !important;
        box-shadow: 0 0 16px rgba(255,211,25,0.8) !important;
        transform: translate(3px, 3px);
      }
    </style>
